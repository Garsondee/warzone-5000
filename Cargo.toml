[workspace]
resolver = "2"
members = ["crates/w5k_math", "crates/w5k_forge", "crates/w5k_tools"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

# Tests and tools do real geometry work; keep debug builds reasonably fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
