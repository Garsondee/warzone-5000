[package]
name = "w5k_forge"
description = "Part Forge: procedural parts and vehicles for warzone-5000 (meshes, physical stats, previews, GLB export)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
w5k_math = { path = "../w5k_math" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
png = "0.18"
font8x8 = "0.3"
serde_json = "1"

[dev-dependencies]
gltf = { version = "1.4", default-features = false, features = ["extras", "names", "utils"] }
