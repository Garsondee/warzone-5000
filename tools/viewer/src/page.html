<!doctype html><meta charset="utf-8"><title>W5K viewer</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:8px;align-items:center;color:#eee;font:13px system-ui;background:#0008;padding:6px 8px;border-radius:6px}#scrub{flex:1}#hud{position:fixed;left:10px;top:8px;color:#fff;font:600 15px system-ui;text-shadow:0 1px 3px #000}#ledger{position:fixed;right:10px;top:8px;color:#fff;font:11px system-ui;text-shadow:0 1px 2px #000;width:230px}#ledger .row{display:flex;align-items:center;gap:6px;height:14px}#ledger span{width:90px;text-align:right}#ledger i{display:block;height:8px;background:#ffb347}#look{position:fixed;left:10px;top:54px;color:#eee;font:12px system-ui;text-shadow:0 1px 2px #000}#toggles{position:fixed;left:10px;top:32px;color:#eee;font:12px system-ui;text-shadow:0 1px 2px #000}#scope{position:fixed;left:8px;right:8px;bottom:50px;width:calc(100vw - 16px);height:150px;background:#0007;border-radius:6px}body.inset #scope{left:auto;right:8px;bottom:8px;width:340px;height:120px}body.inset #ui,body.inset #toggles,body.inset #look,body.inset #ledger{display:none}body.off #scope,body.off #ui,body.off #toggles,body.off #look,body.off #ledger{display:none}#fleet{position:fixed;left:10px;top:76px;color:#fff;font:12px system-ui;text-shadow:0 1px 2px #000}#fleet table{border-collapse:collapse;margin-top:4px}#fleet td,#fleet th{padding:1px 8px 1px 0;text-align:right}#fleet td:first-child,#fleet th:first-child{text-align:left}#fleet .lead{font-weight:600}#labels .label{position:fixed;transform:translate(-50%,-100%);font:600 13px system-ui;text-shadow:0 1px 3px #000,0 0 2px #000;pointer-events:none;white-space:nowrap}</style>
<canvas id="c"></canvas>
<div id="hud"></div><div id="fleet"></div><div id="labels"></div><div id="ledger"></div>
<canvas id="scope" width="1200" height="180"></canvas>
<div id="toggles"><label><input type="checkbox" id="t_contacts" checked>contacts</label> <label><input type="checkbox" id="t_com" checked>datum</label> <label><input type="checkbox" id="t_velocity" checked>velocity</label></div>
<div id="look"><label><input type="checkbox" id="t_camo" checked>camo</label> <select id="scheme"></select> seed <input id="seed" type="number" value="1" style="width:5em"></div>
<div id="ui"><button id="play">pause</button> <input id="scrub" type="range" min="0" max="1" step="0.0005" value="0"> <span id="clock"></span>
 <select id="speed"><option>0.25</option><option selected>1</option><option>2</option><option>4</option></select>x
 <select id="cam"><option value="orbit">orbit</option><option value="chase">chase</option><option value="quarter">quarter</option><option value="front">front</option><option value="rts">rts</option></select> <select id="layout"><option value="full">plots</option><option value="inset">inset</option><option value="off">no plots</option></select></div>
<script id="data" type="application/json">__DATA__</script>
<script type="module">__BOOT__</script>
