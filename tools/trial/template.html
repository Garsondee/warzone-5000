<title>Time Trials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* A test course seen like an instrument panel: neutral charcoal so the saturated vehicles carry the colour (see
   docs/design/06-art-direction.md). Deliberately dark in every theme; the 3D view is its own stage. */
:root {
  color-scheme: dark;
  --bg: #0a0c11; --panel: #11141b; --panel-2: #171b25; --line: #242a38; --fg: #e8ebf2; --dim: #8e97aa; --faint: #5d667a;
  --accent: #38d6ff; --good: #7ee787; --warn: #ffb454; --bad: #ff6b88; --concrete: #8a94a8; --earth: #c0793a;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --head: 'Chakra Petch', 'IBM Plex Sans', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); }
.app { max-width: 1500px; margin: 0 auto; padding-block: 12px 24px; padding-inline: 16px; display: grid; gap: 12px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.top h1 { font: 700 22px/1.1 var(--head); letter-spacing: .02em; margin: 0; }
.top .sub { color: var(--dim); min-width: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .view { aspect-ratio: 4 / 3; } }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.view { position: relative; aspect-ratio: 16 / 9; background: #05060a; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { touch-action: none; cursor: grab; }
#hud.drag { cursor: grabbing; }
#notice { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--dim); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
button, select { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
button:hover, select:hover { border-color: #3b4560; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#play { min-width: 5.2em; font-weight: 600; }
input[type=range] { flex: 1 1 220px; min-width: 120px; accent-color: var(--accent); }
.clock { font: 500 14px var(--mono); min-width: 10.5em; text-align: right; font-variant-numeric: tabular-nums; }
.cams { display: flex; gap: 6px; flex-wrap: wrap; }
.side { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.card h2 { font: 600 12px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; max-height: 380px; overflow: auto; }
.results li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
.results li:hover { background: var(--panel-2); }
.results li[aria-selected="true"] { border-color: var(--accent); background: var(--panel-2); }
.results .dot { width: 10px; height: 10px; border-radius: 50%; }
.results .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results .res { font: 500 12px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.results .res.ok { color: var(--good); }
.results .res.bad { color: var(--bad); }
dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; }
dt { color: var(--dim); }
dd { margin: 0; font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.why { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border-left: 3px solid var(--faint); color: var(--dim); display: none; }
.why.ok { border-color: var(--good); } .why.bad { border-color: var(--bad); }
.why b { color: var(--fg); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.hint { color: var(--faint); font-size: 12px; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--dim); }
</style>

<div class="app">
  <div class="top">
    <h1>Time Trials</h1>
    <span class="sub" id="course"></span>
  </div>
  <div class="layout">
    <section class="stage" aria-label="Replay">
      <div class="view" id="view">
        <canvas id="gl" aria-hidden="true"></canvas>
        <canvas id="hud" aria-label="Replay overlay. Drag to orbit, scroll to zoom, click the profile strip to seek."></canvas>
        <div id="notice"></div>
      </div>
      <div class="bar">
        <button id="play" aria-label="Play or pause">Pause</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Time">
        <span class="clock" id="clock">0:00.0 / 0:00.0</span>
        <label><span class="hint">speed </span><select id="rate" aria-label="Playback speed">
          <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option>
          <option value="2">2x</option><option value="4">4x</option><option value="8">8x</option></select></label>
      </div>
      <div class="bar">
        <div class="cams" id="cams" role="group" aria-label="Camera">
          <button data-cam="chase" aria-pressed="true">Chase</button>
          <button data-cam="side" aria-pressed="false">Side</button>
          <button data-cam="orbit" aria-pressed="false">Orbit</button>
          <button data-cam="overview" aria-pressed="false">Overview</button>
        </div>
        <span class="hint"><kbd>space</kbd> play <kbd>&larr;</kbd><kbd>&rarr;</kbd> seek <kbd>N</kbd><kbd>P</kbd> next vehicle <kbd>1</kbd>-<kbd>4</kbd> camera</span>
      </div>
    </section>
    <aside class="side">
      <div class="card"><h2>Results</h2><ol class="results" id="results"></ol></div>
      <div class="card"><h2 id="vname">Vehicle</h2><dl id="vehicle"></dl><div class="why" id="why"></div></div>
      <div class="card"><h2>Now</h2><dl id="tele"></dl></div>
      <div class="card"><div class="legend"><span><i style="background:var(--concrete)"></i>concrete</span><span><i style="background:var(--earth)"></i>soft earth</span><span><i style="background:var(--accent)"></i>timing gates</span></div></div>
    </aside>
  </div>
</div>
