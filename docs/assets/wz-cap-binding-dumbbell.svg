<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="t">Share of ground designs whose speed cap hides the engine, by propulsion</title><desc id="d">Dumbbell chart. For each propulsion, a light dot shows the share of designs already at the speed cap with no engine research and a dark dot shows the share after all nine engine upgrades. Wheels: 53% to 76%; Hover: 45% to 72%; Half-tracks: 51% to 70%; Tracks: 26% to 28%.</desc>
<rect x="0.5" y="0.5" width="879" height="429" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24.0" y="30.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Engine research mostly lifts designs into the speed cap</text>
<text x="24.0" y="50.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Share of ground designs (every body x weapon) at the propulsion's speed cap on flat ground, before and after all nine engine upgrades.</text>
<circle cx="29.0" cy="76.0" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<text x="42.0" y="80.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">No engine research</text>
<circle cx="194.0" cy="76.0" r="5" fill="#184f95" stroke="#fcfcfb" stroke-width="2"/>
<text x="207.0" y="80.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">All nine engine upgrades</text>
