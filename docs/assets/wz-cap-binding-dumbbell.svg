<text x="418.0" y="366.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">40%</text>
<line x1="552.0" y1="106.0" x2="552.0" y2="348.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt"/>
