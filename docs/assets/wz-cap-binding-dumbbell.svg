<text x="150.0" y="366.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">0%</text>
<line x1="284.0" y1="106.0" x2="284.0" y2="348.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt"/>
<text x="284.0" y="366.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">20%</text>
