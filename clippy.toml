# Clippy configuration for the whole workspace (clippy finds this file by walking up from each crate).
#
# These are the determinism bans (docs/architecture/DETERMINISM.md). CI runs `cargo clippy --workspace --all-targets
# -- -D warnings`, so using any of them by accident fails the pull request.
#
# Why: the standard library's float functions (sin, exp, powf, ...) call whatever maths library the platform has, and
# the last bit of the answer can differ between Linux and Windows. The `libm` crate is pure Rust and gives the same bits
# everywhere. sqrt, abs, min, max, floor, ceil, round, trunc, fract, copysign, signum and plain + - * / are exactly
# rounded by the IEEE standard, so they are fine and are NOT banned.
#
# How to fix a hit: call the function of the same name in `w5k_math::scalar` (scalar::sin(x), scalar::pow(x, y),
# scalar::exp(x), scalar::powi(x, 3), ...). That module wraps the pure-Rust `libm` crate, so every lane gets the same bits
# on every platform and no lane needs its own `libm` dependency. If the function you need is missing, file an interface
# request (docs/swarm/requests/) rather than reaching for `libm` directly. For a small integer power just write x * x.
# f32 is for presentation only (mesh vertex buffers, colours): convert to f64 for maths, or call `libm::sinf` and friends
# in that rendering-only crate.
#
# Exceptions: only in tooling that never feeds the simulation (reports, charts, timing a CLI run), with
# `#![allow(clippy::disallowed_methods)]` or `#![allow(clippy::disallowed_types)]` at the top of that module plus a
# comment saying why it is safe. Never in a simulation crate.

disallowed-methods = [
  # ---- trigonometry ----
  { path = "f64::sin", reason = "std f64::sin is not bit-identical across platforms; use w5k_math::scalar::sin" },
  { path = "f64::cos", reason = "std f64::cos is not bit-identical across platforms; use w5k_math::scalar::cos" },
  { path = "f64::tan", reason = "std f64::tan is not bit-identical across platforms; use w5k_math::scalar::tan" },
  { path = "f64::asin", reason = "std f64::asin is not bit-identical across platforms; use w5k_math::scalar::asin" },
  { path = "f64::acos", reason = "std f64::acos is not bit-identical across platforms; use w5k_math::scalar::acos" },
  { path = "f64::atan", reason = "std f64::atan is not bit-identical across platforms; use w5k_math::scalar::atan" },
  { path = "f64::atan2", reason = "std f64::atan2 is not bit-identical across platforms; use w5k_math::scalar::atan2" },
  { path = "f64::sin_cos", reason = "std f64::sin_cos is not bit-identical across platforms; use w5k_math::scalar::sin_cos" },
  # ---- hyperbolic ----
  { path = "f64::sinh", reason = "std f64::sinh is not bit-identical across platforms; use w5k_math::scalar::sinh" },
  { path = "f64::cosh", reason = "std f64::cosh is not bit-identical across platforms; use w5k_math::scalar::cosh" },
  { path = "f64::tanh", reason = "std f64::tanh is not bit-identical across platforms; use w5k_math::scalar::tanh" },
  { path = "f64::asinh", reason = "std f64::asinh is not bit-identical across platforms; use w5k_math::scalar::asinh" },
  { path = "f64::acosh", reason = "std f64::acosh is not bit-identical across platforms; use w5k_math::scalar::acosh" },
  { path = "f64::atanh", reason = "std f64::atanh is not bit-identical across platforms; use w5k_math::scalar::atanh" },
  # ---- exponentials and logarithms ----
  { path = "f64::exp", reason = "std f64::exp is not bit-identical across platforms; use w5k_math::scalar::exp" },
  { path = "f64::exp2", reason = "std f64::exp2 is not bit-identical across platforms; use w5k_math::scalar::exp2" },
  { path = "f64::exp_m1", reason = "std f64::exp_m1 is not bit-identical across platforms; use w5k_math::scalar::exp_m1" },
  { path = "f64::ln", reason = "std f64::ln is not bit-identical across platforms; use w5k_math::scalar::ln" },
  { path = "f64::ln_1p", reason = "std f64::ln_1p is not bit-identical across platforms; use w5k_math::scalar::ln_1p" },
  { path = "f64::log", reason = "std f64::log is not bit-identical across platforms; use w5k_math::scalar::log(x, base)" },
  { path = "f64::log2", reason = "std f64::log2 is not bit-identical across platforms; use w5k_math::scalar::log2" },
  { path = "f64::log10", reason = "std f64::log10 is not bit-identical across platforms; use w5k_math::scalar::log10" },
  # ---- powers, roots, fused multiply-add ----
  { path = "f64::powf", reason = "std f64::powf is not bit-identical across platforms; use w5k_math::scalar::pow" },
  { path = "f64::powi", reason = "std f64::powi is not bit-identical across platforms; use w5k_math::scalar::powi (or write x * x)" },
  { path = "f64::hypot", reason = "std f64::hypot is not bit-identical across platforms; use w5k_math::scalar::hypot" },
  { path = "f64::cbrt", reason = "std f64::cbrt is not bit-identical across platforms; use w5k_math::scalar::cbrt" },
  { path = "f64::mul_add", reason = "std f64::mul_add may or may not fuse depending on the CPU; use w5k_math::scalar::fma" },

  # ---- the same list for f32 ----
  { path = "f32::sin", reason = "std f32::sin is not bit-identical across platforms; use libm::sinf" },
  { path = "f32::cos", reason = "std f32::cos is not bit-identical across platforms; use libm::cosf" },
  { path = "f32::tan", reason = "std f32::tan is not bit-identical across platforms; use libm::tanf" },
  { path = "f32::asin", reason = "std f32::asin is not bit-identical across platforms; use libm::asinf" },
  { path = "f32::acos", reason = "std f32::acos is not bit-identical across platforms; use libm::acosf" },
  { path = "f32::atan", reason = "std f32::atan is not bit-identical across platforms; use libm::atanf" },
  { path = "f32::atan2", reason = "std f32::atan2 is not bit-identical across platforms; use libm::atan2f" },
  { path = "f32::sin_cos", reason = "std f32::sin_cos is not bit-identical across platforms; use libm::sincosf" },
  { path = "f32::sinh", reason = "std f32::sinh is not bit-identical across platforms; use libm::sinhf" },
  { path = "f32::cosh", reason = "std f32::cosh is not bit-identical across platforms; use libm::coshf" },
  { path = "f32::tanh", reason = "std f32::tanh is not bit-identical across platforms; use libm::tanhf" },
  { path = "f32::asinh", reason = "std f32::asinh is not bit-identical across platforms; use libm::asinhf" },
  { path = "f32::acosh", reason = "std f32::acosh is not bit-identical across platforms; use libm::acoshf" },
  { path = "f32::atanh", reason = "std f32::atanh is not bit-identical across platforms; use libm::atanhf" },
  { path = "f32::exp", reason = "std f32::exp is not bit-identical across platforms; use libm::expf" },
  { path = "f32::exp2", reason = "std f32::exp2 is not bit-identical across platforms; use libm::exp2f" },
  { path = "f32::exp_m1", reason = "std f32::exp_m1 is not bit-identical across platforms; use libm::expm1f" },
  { path = "f32::ln", reason = "std f32::ln is not bit-identical across platforms; use libm::logf" },
  { path = "f32::ln_1p", reason = "std f32::ln_1p is not bit-identical across platforms; use libm::log1pf" },
  { path = "f32::log", reason = "std f32::log is not bit-identical across platforms; use libm::logf (and divide)" },
  { path = "f32::log2", reason = "std f32::log2 is not bit-identical across platforms; use libm::log2f" },
  { path = "f32::log10", reason = "std f32::log10 is not bit-identical across platforms; use libm::log10f" },
  { path = "f32::powf", reason = "std f32::powf is not bit-identical across platforms; use libm::powf" },
  { path = "f32::powi", reason = "std f32::powi is not bit-identical across platforms; write x * x, or use libm::powf" },
  { path = "f32::hypot", reason = "std f32::hypot is not bit-identical across platforms; use libm::hypotf" },
  { path = "f32::cbrt", reason = "std f32::cbrt is not bit-identical across platforms; use libm::cbrtf" },
  { path = "f32::mul_add", reason = "std f32::mul_add may or may not fuse depending on the CPU; use libm::fmaf" },

  # ---- the wall clock ----
  { path = "std::time::Instant::now", reason = "no wall clock in simulation: results must not depend on real time (use the tick count)" },
  { path = "std::time::SystemTime::now", reason = "no wall clock in simulation: results must not depend on real time (use the tick count)" },
]

disallowed-types = [
  { path = "std::collections::HashMap", reason = "random iteration order breaks determinism; use BTreeMap or an indexed Vec (tooling may #![allow(clippy::disallowed_types)] with a justification)" },
  { path = "std::collections::HashSet", reason = "random iteration order breaks determinism; use BTreeSet or an indexed Vec (tooling may #![allow(clippy::disallowed_types)] with a justification)" },
]
